<div class="col-md-6 probability-likelihood">
	<fieldset id="Scale_Probability">
		<legend>
			<span th:if="${type == 'QUALITATIVE'}" th:text="#{label.title.probability}"></span>
			<span th:if="${type != 'QUALITATIVE'}" th:text="#{label.parameter.extended.probability}"></span>
		</legend>
		<table class="table table-hover table-fixed-header-analysis table-condensed">
			<thead>
				<tr>
					<th width="1%" class="textaligncenter" th:text="#{label.parameter.level}"></th>
					<th th:if="${type != null and type.quantitative}" class="textaligncenter" width="1%" th:text="#{label.parameter.acronym}"></th>
					<th th:if="${type != null and type.qualitative == true}" class="textaligncenter" th:attr="width=${(type != null and type.quantitative == true) ? '10%' : '20%'}" th:text="#{label.parameter.label}"></th>
					<th data-th-name="qualification" th:text="#{label.parameter.qualification}"></th>
					<th th:if="${type != null and type.quantitative}" class="textaligncenter" width="8%" th:text="|#{label.parameter.value} #{label.assessment.likelihood.unit}|"></th>
					<th th:if="${type != null and type.quantitative}" class="textaligncenter" width="8%" th:text="#{label.parameter.range.min}"></th>
					<th th:if="${type != null and type.quantitative}" class="textaligncenter" width="8%" th:text="#{label.parameter.range.max}"></th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${type != null and type.quantitative == true}" data-trick-class="LikelihoodParameter" hidden="true">
					<td data-trick-field="acronym" colspan="3" th:text="#{label.status.na}"></td>
					<td data-trick-field="value" colspan="3">0</td>
				</tr>
				<th:block th:with="probaList=${(mappedParameters != null and mappedParameters['PROBA'] != null) ? mappedParameters['PROBA'] : {}}, length=${#lists.size(probaList) - 1}">
					<th:block th:each="parameter, status : ${probaList}">
						<tr data-trick-class="LikelihoodParameter" data-trick-id="${parameter.id}">
							<td data-trick-field="level" class="textaligncenter" th:text="${parameter.level}"></td>
							<td th:if="${type != null and type.quantitative == true}" data-trick-field="acronym" class="textaligncenter" th:text="${parameter.acronym}"></td>
							<td th:if="${type != null and type.qualitative == true}" data-trick-field="label" class="textaligncenter" th:attr="data-trick-acronym-value=${parameter.acronym}">
								<span th:text="${parameter.label}"></span>
							</td>
							<td data-trick-field="description" data-trick-content="text" data-trick-field-type="string" class="editable" onclick="return editField(this);" th:text="${parameter.description}"></td>
							<td th:if="${type != null and type.quantitative == true}" data-trick-field="value" data-trick-field-type="double" onclick="return editField(this);" class="editable textaligncenter" title="${parameter.value}" data-real-value="${parameter.value}">
								<span th:text="${#numbers.formatDecimal(parameter.value != null ? parameter.value : 0, 0, 2)}"></span>
							</td>
							<td th:if="${type != null and type.quantitative == true}" class="textaligncenter">
								<span th:text="${#numbers.formatDecimal(parameter.bounds != null && parameter.bounds.from != null ? parameter.bounds.from : 0, 0, 2)}"></span>
							</td>
							<td th:if="${type != null and type.quantitative == true}" class="textaligncenter">
								<span th:if="${status.index != length}">
									<span th:text="${#numbers.formatDecimal(parameter.bounds != null && parameter.bounds.to != null ? parameter.bounds.to : 0, 0, 2)}"></span>
								</span>
								<span th:if="${status.index == length}" style="font-size: 17px;">+&#8734;</span>
							</td>
						</tr>
					</th:block>
				</th:block>
			</tbody>
		</table>
	</fieldset>
</div>
