<div id="tab-risk-estimation" class="tab-pane trick-container max-height" data-update-required="true" data-trigger="riskEstimationUpdate">
    <div class="max-height">
        <div class="col-md-3 col-lg-2 max-height" style="z-index: 1" role="left-menu">
            <div class="affixMenu max-height">
                <div class="page-header tab-content-header">
                    <div class="container">
                        <div class="row-fluid">
                            <h3 th:text="#{label.title.risk_estimation}">Risk Estimation</h3>
                        </div>
                    </div>
                </div>

                <div class="form-group input-group">
                    <div th:if="${isEditable}">
                        <span class="input-group-btn">
                            <button class="btn btn-cat-add" name="add-asset" style="padding-top: 5.5px; width: 95px; text-align: left;">
                                <i class="fa fa-plus"></i> <span th:text="#{label.title.assets}">Assets</span>
                            </button>
                        </span>
                    </div>
                    <div th:unless="${isEditable}">
                        <span class="input-group-addon">
                            <span style="width: 55px; display: block; text-align: left;" th:text="#{label.title.assets}">Assets</span>
                        </span>
                    </div>
                    <select name="asset" class="form-control">
                        <option value="0" th:title="#{label.all}" th:text="#{label.all}">All</option>
                        <th:block th:each="asset : ${assets}">
                            <span th:if="${asset != null}" th:text="${asset.name}" th:utext="true"
                                  th:attr="data-trick-type=${asset.assetType != null ? asset.assetType.id : 0}, data-trick-selected=${asset.selected != null ? asset.selected : false}"></span>
                            <th:block th:if="${asset != null and asset.selected}">
                <option th:value="${asset.id != null ? asset.id : 0}"
                    th:attr="data-trick-type=${asset.assetType != null ? asset.assetType.id : 0}, data-trick-selected='true'"
                    th:title="${asset.name}" selected="selected"
                    th:text="${asset.name}"></option>
                            </th:block>
                            <th:block th:if="${asset != null and !asset.selected}">
                <option th:value="${asset.id != null ? asset.id : 0}"
                    th:attr="data-trick-type=${asset.assetType != null ? asset.assetType.id : 0}, data-trick-selected='false'"
                    hidden="hidden"
                    th:title="${asset.name}"
                    th:text="${asset.name}"></option>
                            </th:block>
                        </th:block>
                    </select>
                </div>

                <div class="form-group input-group">
                    <div th:if="${isEditable}">
                        <span class="input-group-btn">
                            <button class="btn btn-cat-add" name="add-scenario" style="padding-top: 5.5px; width: 95px; text-align: left;">
                                <i class="fa fa-plus"></i> <span th:text="#{label.title.risk_estimation.scenario}">Scenario</span>
                            </button>
                        </span>
                    </div>
                    <div th:unless="${isEditable}">
                        <span class="input-group-addon">
                            <span style="width: 55px; display: block; text-align: left;" th:text="#{label.title.risk_estimation.scenario}">Scenario</span>
                        </span>
                    </div>
                    <select name="scenario" class="form-control">
                        <option value="0" th:title="#{label.all}" th:text="#{label.all}">All</option>
                        <th:block th:each="scenario : ${scenarios}">
                            <span th:if="${scenario != null}" th:text="${scenario.name}" th:utext="true"
                                  th:attr="data-trick-type=${scenario.assetTypeIds() != null ? scenario.assetTypeIds() : ''}, data-trick-selected=${scenario.selected != null ? scenario.selected : false}"></span>
                            <th:block th:if="${scenario != null and scenario.selected}">
                <option th:value="${scenario.id != null ? scenario.id : 0}"
                    th:attr="data-trick-selected='true', data-trick-linked=${scenario.assetLinked != null ? scenario.assetLinked : false}"
                    th:title="${scenario.name}" th:text="${scenario.name}"></option>
                            </th:block>
                            <th:block th:if="${scenario != null and !scenario.selected}">
                <option th:value="${scenario.id != null ? scenario.id : 0}"
                    hidden="hidden"
                    th:attr="data-trick-linked=${scenario.assetLinked != null ? scenario.assetLinked : false}, data-trick-selected='false'"
                    th:title="${scenario.name}" th:text="${scenario.name}"></option>
                            </th:block>
                        </th:block>
                    </select>
                </div>

                <div class="form-group nav-chapter" data-trick-content="scenario">
                    <div class="list-group">
                        <a href="#" th:title="#{label.title.risk_estimation.scenario}"
                           style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                           class="list-group-item active lead" data-trick-id="0"
                           th:text="#{label.title.risk_estimation.scenario}">Scenario</a>

                        <th:block th:each="scenario : ${scenarios}">
                            <span th:if="${scenario != null}" th:text="${scenario.name}" th:utext="true"
                                  th:attr="data-trick-selected=${scenario.selected != null ? scenario.selected : false}, data-trick-linked=${scenario.assetLinked != null ? scenario.assetLinked : false}, data-trick-type=${scenario.assetTypeIds() != null ? scenario.assetTypeIds() : ''}"></span>

                            <th:block th:if="${scenario != null}"
                                      th:with="displayFlag=${(scenario.assetLinked != null ? scenario.assetLinked : false) ? ((scenario.selected != null ? scenario.selected : false) and currentAssetId != null and scenario.assetTypeIds() != null and currentAssetId.matches(scenario.assetTypeIds())) : ((scenario.selected != null ? scenario.selected : false) and currentAssetType != null and scenario.assetTypeIds() != null and currentAssetType.matches(scenario.assetTypeIds()))}">
                                          <a href="#"
                                              th:title="${scenario.name}"
                                              th:attr="data-trick-id=${scenario.id != null ? scenario.id : 0}, data-trick-selected=${scenario.selected != null ? scenario.selected : false}, data-trick-linked=${scenario.assetLinked != null ? scenario.assetLinked : false}, data-trick-type=${scenario.assetTypeIds() != null ? scenario.assetTypeIds() : ''}"
                                   style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                                   th:styleappend="|;display: ${displayFlag} ? inline-block : none;|"
                                   class="list-group-item"
                                   th:text="${scenario.name}">Scenario Name</a>
                            </th:block>
                        </th:block>
                    </div>
                </div>

                <div class="form-group nav-chapter" style="display: none;" data-trick-content="asset">
                    <div class="list-group">
                        <a href="#" th:title="#{label.title.assets}"
                           style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                           class="list-group-item active lead" data-trick-id="0"
                           th:text="#{label.title.assets}">Assets</a>

                        <th:block th:each="asset : ${assets}">
                                     <a th:if="${asset != null}" href="#"
                                         th:title="${asset.name}"
                                         th:attr="data-trick-id=${asset.id != null ? asset.id : 0}, data-trick-selected=${asset.selected != null ? asset.selected : false}, data-trick-type=${asset.assetType != null ? asset.assetType.id : 0}"
                               style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                               th:styleappend="|;display: ${(asset.selected != null ? asset.selected : false)} ? inline-block : none;|"
                               class="list-group-item"
                               th:text="${asset.name}">Asset</a>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

    <th:block th:include="templates/analyses/single/components/risk-estimation/asset/home :: home"></th:block>
    </div>
</div>
