<div class="modal fade" id="manageImpactModal" tabindex="-1" role="dialog"
     data-aria-labelledby="manageImpactModal" data-aria-hidden="true" data-backdrop="static"
    data-keyboard="true"
    th:with="includeLabel=#{label.action.include},
            excludeLabel=#{label.action.exclude},
            saveLabel=#{label.action.save},
            cancelLabel=#{label.action.cancel}">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" data-aria-hidden="true"
                        data-loading-text="&times;">&times;</button>
                <h4 class="modal-title" th:text="#{label.title.manage.analysis.impact_scale}">
                    Manage analysis impact scale
                </h4>
            </div>
            <div class="modal-body" style="padding: 5px 20px;">
                <div class="alert alert-sm alert-danger" style="margin-top: 0; margin-bottom: 0"
                     th:text="#{info.manage.impact.remove}">Removing an impact removes associated values.</div>
                <form id="manage-analysis-impact-scale"
                      th:action="@{/Analysis/Prameter/Impact-scale/Manage/Save}"
                      method="post"
                      class="form-horizontal">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div>
                        <div>
                            <h4 class="col-xs-7 bordered-bottom" style="padding-left: 0;"
                                th:text="#{label.title.impact_scale}">Impact scale</h4>
                            <h4 class="col-xs-5 bordered-bottom text-center"
                                th:text="#{label.action}">Action</h4>
                        </div>
                    </div>
                    <div class="form-horizontal" style="height: 500px; overflow-x: hidden; clear: both;">
                        <div th:if="${quantitativeImpact != null}"
                             class="form-group" th:attr="data-trick-id=${quantitativeImpact.id}"
                             style="margin-bottom: 0;">
                            <div class="col-xs-7">
                                <strong style="vertical-align: middle;"
                                        th:text="#{label.analysis.quantitative.impact}">Quantitative impact</strong>
                            </div>
                            <div class="col-xs-5 text-center">
                                <div class="btn-group" data-toggle="buttons">
                                    <label class="btn btn-sm btn-default"
                                           th:classappend="${quantitativeImpactEnabled} ? ' active' : ''">
                                        <span th:text="${includeLabel}">Include</span>
                                        <input type="radio"
                                               th:name="${quantitativeImpact.id}"
                                               value="true"
                                               th:checked="${quantitativeImpactEnabled}" />
                                    </label>
                                    <label class="btn btn-sm btn-danger"
                                           th:classappend="${!quantitativeImpactEnabled} ? ' active' : ''">
                                        <span th:text="${excludeLabel}">Exclude</span>
                                        <input type="radio"
                                               th:name="${quantitativeImpact.id}"
                                               value="false"
                                               th:checked="${!quantitativeImpactEnabled}" />
                                    </label>
                                </div>
                            </div>
                            <input type="hidden"
                                   th:name="${'default-value-' + quantitativeImpact.id}"
                                   th:value="${quantitativeImpactEnabled}" />
                        </div>
                        <h5 class="bordered-bottom text-muted" style="margin-top: 0;"
                            th:text="#{label.analysis.type.qualitative}">Qualitative</h5>
                        <div th:each="entry : ${qualitativeImpacts.entrySet()}"
                             class="form-group"
                             th:attr="data-trick-id=${entry.key.id}">
                            <div class="col-xs-7"
                                 th:with="translation=${entry.key.translations != null ? entry.key.translations[langue] : null},
                                          displayName=${translation != null ? translation.name : entry.key.displayName}">
                                <strong style="vertical-align: middle;" th:text="${displayName}">Impact name</strong>
                            </div>
                            <div class="col-xs-5 text-center">
                                <div class="btn-group" data-toggle="buttons">
                                    <label class="btn btn-sm btn-default"
                                           th:classappend="${entry.value} ? ' active' : ''">
                                        <span th:text="${includeLabel}">Include</span>
                                        <input type="radio"
                                               th:name="${entry.key.id}"
                                               value="true"
                                               th:checked="${entry.value}" />
                                    </label>
                                    <label class="btn btn-sm btn-danger"
                                           th:classappend="${!entry.value} ? ' active' : ''">
                                        <span th:text="${excludeLabel}">Exclude</span>
                                        <input type="radio"
                                               th:name="${entry.key.id}"
                                               value="false"
                                               th:checked="${!entry.value}" />
                                    </label>
                                </div>
                            </div>
                            <input type="hidden"
                                   th:name="${'default-value-' + entry.key.id}"
                                   th:value="${entry.value}" />
                        </div>
                    </div>
                </form>
                <div class="clearfix"></div>
            </div>
            <div class="modal-footer">
        <button type="button" class="btn btn-primary" name="save"
            th:attr="data-loading-text=${saveLabel}"
            th:text="${saveLabel}">Save</button>
        <button type="button" class="btn btn-default" name="cancel" data-dismiss="modal"
            th:attr="data-loading-text=${cancelLabel}"
            th:text="${cancelLabel}">Cancel</button>
            </div>
            <div class="hidden">
                <code data-lang-code="error.manage.impact.empty"
                      th:text="#{error.manage.impact.empty}">At least one impact must remain.</code>
                <code data-lang-code="info.manage.impact.remove"
                      th:text="#{info.manage.impact.remove}">Removing an impact removes associated values.</code>
            </div>
        </div>
    </div>
</div>
