<div
  th:with="
    analysisType=${analysis != null ? analysis.type : null},
    nameControl=${analysisType != null ? #strings.toLowerCase(analysisType?.name() ?: analysisType.toString()) : 'hybrid'},
    resolvedAnalysisId=${analysis != null ? analysis.id : (analysisId != null ? analysisId : 0)},
    maxSizeInfo=${
      maxFileSize < 1024
        ? #messages.msg('label.max.unit.data.byte', maxFileSize)
        : (maxFileSize < 1048576
            ? #messages.msg('label.max.unit.data.kilo.byte', maxFileSize / 1024)
            : #messages.msg('label.max.unit.data.mega.byte', maxFileSize / 1048576))
    }
  "
>
  <div class="modal fade" id="exportAnalysisReportModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">

        <div class="modal-header">
          <h4 class="modal-title" th:text="#{label.export.analysis.report}">
            Export Analysis Report
          </h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <div class="modal-body">
          <form th:action="@{/Analysis/Data-manager/Export}" method="post" enctype="multipart/form-data">

            <!-- Type selector -->
            <div class="form-group">
              <label th:text="#{label.analysis.type}">Type</label>
              <div>
                <label
                  th:each="type : ${types}"
                  th:with="
                    typeName=${type?.name() ?: type},
                    typeValue=${#strings.toLowerCase(typeName)}
                  "
                  class="radio-inline"
                >
                  <input
                    type="radio"
                    th:name="${'type'}"
                    th:value="${typeValue}"
                    th:checked="${nameControl == typeValue}"
                  />
                  <span th:text="${typeName}">HYBRID</span>
                </label>
              </div>
            </div>

            <!-- Template selector -->
            <div class="form-group">
              <label th:text="#{label.analysis.template}">Template</label>
              <select name="template" class="form-control">
                <option value="0" th:text="#{label.select}">Select</option>
                <option
                  th:each="template : ${templates}"
                  th:value="${template.id}"
                  th:text="${template.name}"
                  th:data-trick-type="${template.analysisType?.name() ?: template.analysisType}"
                >
                  Template Name
                </option>
              </select>
            </div>

            <!-- Other export options -->
            <div class="form-group">
              <label th:text="#{label.analysis.language}">Language</label>
              <select name="language" class="form-control" required>
                <option value="0" th:text="#{label.select}">Select</option>
                <option
                  th:each="language : ${languages}"
                  th:value="${language.code}"
                  th:text="${language.displayName}"
                ></option>
              </select>
            </div>

            <div class="form-group">
              <label th:text="#{label.export.comment}">Comment</label>
              <textarea name="comment" class="form-control" rows="3"></textarea>
            </div>

            <input type="hidden" name="analysisId" th:value="${resolvedAnalysisId}" />
            <p class="text-muted">
              <small th:text="${maxSizeInfo}">Maximum file size: 10 MB</small>
            </p>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal" th:text="#{label.cancel}">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" th:text="#{label.export}">
            Export
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- END: modal.html -->
