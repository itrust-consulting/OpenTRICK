<th:block th:fragment="content">
    <th:block th:each="categoryRiskInformation : ${riskInformationSplited.keySet()}">
        <div class="tab-pane" th:id="'tab-risk-information-' + ${#strings.toLowerCase(categoryRiskInformation)}">
            <div class="section" th:id="'section_risk-information_' + ${#strings.toLowerCase(categoryRiskInformation)}">
                <div class="page-header tab-content-header table-condensed">
                    <div class="container">
                        <div class="row-fluid">
                            <h3>
                                <th:block th:switch="${categoryRiskInformation}">
                                    <th:block th:case="'threat'">
                                        <span th:text="#{label.title.risk_information.threat}">Threat</span>
                                    </th:block>
                                    <th:block th:case="'vul'">
                                        <span th:text="#{label.title.risk_information.vulnerabilities}">Vulnerabilities</span>
                                    </th:block>
                                    <th:block th:case="*">
                                        <span th:text="#{label.title.risk_information.risks}">Risks</span>
                                    </th:block>
                                </th:block>
                                <th:block th:if="${isEditable}">
                                    <span class="pull-right" style="margin-top: -1px;">
                                        <a href="#" class="btn btn-xs btn-link" th:onclick="|return manageBrainstorming('${categoryRiskInformation}');|">
                                            <i class="glyphicon glyphicon-cog"></i>
                                            <span th:text="#{label.action.manage}">Manage</span>
                                        </a>
                                    </span>
                                </th:block>
                            </h3>
                        </div>
                    </div>
                </div>

                <table th:id="'table_' + ${categoryRiskInformation}" class="table table-condensed table-hover table-fixed-header-analysis">
                    <thead>
                        <tr>
                            <th width="5%" title="#{label.title.id}">
                                <span th:text="#{label.risk_information.id}">ID</span>
                            </th>
                            <th:block th:switch="${categoryRiskInformation}">
                                <th:block th:case="'threat'">
                                    <th width="15%" title="#{label.name}">
                                        <span th:text="#{label.name}">Name</span>
                                    </th>
                                    <th width="5%" title="#{label.risk_information.acronym}">
                                        <span th:text="#{label.risk_information.acro}">Acronym</span>
                                    </th>
                                </th:block>
                                <th:block th:case="'vul'">
                                    <th width="25%" title="#{label.name}">
                                        <span th:text="#{label.name}">Name</span>
                                    </th>
                                </th:block>
                                <th:block th:case="*">
                                    <th width="15%" title="#{label.name}">
                                        <span th:text="#{label.name}">Name</span>
                                    </th>
                                </th:block>
                            </th:block>
                            <th width="5%" title="#{label.risk_information.exposed}">
                                <span th:text="#{label.risk_information.expo}">Exposed</span>
                            </th>
                            <th width="5%" title="#{label.title.risk_information.owner}">
                                <span th:text="#{label.risk_information.owner}">Owner</span>
                            </th>
                            <th width="30%" title="#{label.risk_information.comment}">
                                <span th:text="#{label.risk_information.comment}">Comment</span>
                            </th>
                            <th:block th:if="${showHiddenComment}">
                                <th width="30%" title="#{label.risk_information.comment_hidden}">
                                    <span th:text="#{label.risk_information.comment_hidden}">Hidden Comment</span>
                                </th>
                            </th:block>
                        </tr>
                    </thead>
                    <tfoot></tfoot>
                    <tbody>
                        <tr th:each="riskInformation : ${riskInformationSplited.get(categoryRiskInformation)}"
                            th:data-trick-class="'RiskInformation'"
                            th:data-trick-id="${riskInformation.id}"
                            th:with="isCustom=${riskInformation.custom},
                                     suffix=${riskInformation.category == 'Risk_TBA' ? '_tba.' : (riskInformation.category == 'Risk_TBS' ? '_tbs.' : '.')},
                                     codeKey=${'label.risk_information.' + #strings.toLowerCase(categoryRiskInformation) + suffix + #strings.replace(riskInformation.chapter,'.','_')},
                                     chapterMatch=${(chapterRegex != null) and (riskInformation.chapter != null) and (riskInformation.chapter.matches(chapterRegex))}">
                            <th:block th:switch="${chapterMatch}">
                                <th:block th:case="true">
                                    <td style="height: 32px;">
                                        <strong th:text="${riskInformation.chapter}"></strong>
                                    </td>
                                    <th:block th:switch="${categoryRiskInformation}">
                                        <th:block th:case="'threat'">
                                            <td colspan="2">
                                                <strong th:text="${isCustom ? riskInformation.label : #messages.msg(codeKey)}"></strong>
                                            </td>
                                        </th:block>
                                        <th:block th:case="*">
                                            <td>
                                                <strong th:text="${isCustom ? riskInformation.label : #messages.msg(codeKey)}"></strong>
                                            </td>
                                        </th:block>
                                    </th:block>
                                    <td class="editable"
                                        th:data-trick-field="exposed"
                                        th:data-trick-choose="',++,+,N,-,--'"
                                        th:data-trick-field-type="string"
                                        th:onclick="|return editField(this);|">
                                        <span th:text="${riskInformation.exposed}"></span>
                                    </td>
                                    <td class="editable"
                                        th:data-trick-field="owner"
                                        th:data-trick-field-type="string"
                                        th:onclick="|return editField(this);|">
                                        <span th:text="${riskInformation.owner}"></span>
                                    </td>
                                    <td class="editable"
                                        th:data-trick-field="comment"
                                        th:data-trick-content="text"
                                        th:data-trick-field-type="string"
                                        th:onclick="|return editField(this);|">
                                        <span th:text="${riskInformation.comment}"></span>
                                    </td>
                                    <th:block th:if="${showHiddenComment}">
                                        <td class="editable"
                                            th:data-trick-field="hiddenComment"
                                            th:data-trick-content="text"
                                            th:data-trick-field-type="string"
                                            th:onclick="|return editField(this);|">
                                            <span th:text="${riskInformation.hiddenComment}"></span>
                                        </td>
                                    </th:block>
                                </th:block>
                                <th:block th:case="false">
                                    <td style="height: 32px;" th:text="${riskInformation.chapter}"></td>
                                    <td th:text="${isCustom ? riskInformation.label : #messages.msg(codeKey)}"></td>
                                    <th:block th:if="${categoryRiskInformation == 'threat'}">
                                        <td class="editable"
                                            th:data-trick-field="acronym"
                                            th:data-trick-field-type="string"
                                            th:onclick="|return editField(this);|">
                                            <span th:text="${riskInformation.acronym}"></span>
                                        </td>
                                    </th:block>
                                    <td class="editable"
                                        th:data-trick-field="exposed"
                                        th:data-trick-choose="',++,+,N,-,--'"
                                        th:data-trick-field-type="string"
                                        th:onclick="|return editField(this);|">
                                        <span th:text="${riskInformation.exposed}"></span>
                                    </td>
                                    <td class="editable"
                                        th:data-trick-field="owner"
                                        th:data-trick-field-type="string"
                                        th:onclick="|return editField(this);|">
                                        <span th:text="${riskInformation.owner}"></span>
                                    </td>
                                    <td class="editable"
                                        th:data-trick-field="comment"
                                        th:data-trick-content="text"
                                        th:data-trick-field-type="string"
                                        th:onclick="|return editField(this);|">
                                        <span th:text="${riskInformation.comment}"></span>
                                    </td>
                                    <th:block th:if="${showHiddenComment}">
                                        <td class="editable"
                                            th:data-trick-field="hiddenComment"
                                            th:data-trick-content="text"
                                            th:data-trick-field-type="string"
                                            th:onclick="|return editField(this);|">
                                            <span th:text="${riskInformation.hiddenComment}"></span>
                                        </td>
                                    </th:block>
                                </th:block>
                            </th:block>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </th:block>
</th:block>
