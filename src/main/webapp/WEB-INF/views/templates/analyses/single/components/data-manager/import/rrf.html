<div data-view-content-name="rrf">
    <ul class="nav nav-tabs nav-justified">
        <li class="active">
            <a href="#import-${rawRRFItem.name}" data-toggle="tab">
                <span th:text="#{label.from.excel.file}">File</span>
            </a>
        </li>
        <li>
            <a href="#import-${rrfItem.name}" data-toggle="tab">
                <span th:text="#{label.from.knowledge_base}">Knowledge base</span>
            </a>
        </li>
    </ul>
    <div class="tab-content" data-view-tab="secondary">
        <div th:with="item=${rawRRFItem}" class="tab-pane active" id="import-${item.name}"
             data-view-name="${item.name}" data-view-process-url="${item.processURL}" data-view-extentions="${item.extensions}">
            <!-- full include instead of fragment -->
            <div th:replace="~{templates/analyses/single/components/data-manager/import/default :: content}"></div>
        </div>

        <div class="tab-pane" id="import-${rrfItem.name}" data-view-name="${rrfItem.name}" data-view-process-url="${rrfItem.processURL}">
            <fieldset>
                <legend>
                    <span th:text="#{label.title.data_manager.import.rrf}"></span>
                </legend>
                <div class="alert alert-sm alert-danger" style="margin-bottom: 15px">
                    <span th:text="#{info.import.rrf}"></span>
                </div>
                <form action="#" class="form">
                    <div class="form-group">
                        <label class="control-label" th:data-helper-content="#{help.rrf.customer}">
                            <span th:text="#{label.customers}"></span>
                        </label>
                        <select class="form-control" name="customer">
                            <th:block th:each="customer : ${customers}">
                                <option th:value="${customer.id}">
                                    <span th:text="${customer.organisation}"></span>
                                </option>
                            </th:block>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="control-label" th:data-helper-content="#{help.rrf.analysis}">
                            <span th:text="#{label.analyses}"></span>
                        </label>
                        <select class="form-control" name="analysis">
                            <th:block th:each="analysis : ${analyses}">
                                <th:block th:if="${analysis != null}"
                                          th:with="analysisId=${analysis.id != null ? analysis.id : 0},
                                                   customerId=${analysis.customer != null ? analysis.customer.id : 0},
                                                   analysisLabel=${analysis.label != null ? analysis.label : ''},
                                                   analysisVersion=${analysis.version != null ? analysis.version : ''}">
                                    <th:block th:if="${analysis.profile == true}">
                                        <option th:value="${analysisId}"
                                                th:title="#{{${analysisLabel}}}"
                                                th:data-trick-id="${customerId}">
                                            <span th:text="${analysisLabel}"></span>
                                        </option>
                                    </th:block>
                                    <th:block th:unless="${analysis.profile == true}">
                                        <option th:value="${analysisId}"
                                                th:title="#{{${analysisLabel} - v.${analysisVersion}}}"
                                                th:data-trick-id="${customerId}">
                                            <span th:text="${analysisLabel} - v.${analysisVersion}"></span>
                                        </option>
                                    </th:block>
                                </th:block>
                            </th:block>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:data-helper-content="#{help.rrf.standard}">
                            <span th:text="#{label.standards}"></span>
                        </label>
                        <select class="form-control" name="standards" multiple="multiple">
                            <th:block th:each="analysis : ${analyses}">
                                <th:block th:if="${analysis != null}"
                                          th:with="analysisId=${analysis.id != null ? analysis.id : 0},
                                                   analysisStandards=${analysis.analysisStandards != null ? analysis.analysisStandards.values() : {}}">
                                    <th:block th:each="analysisStandard : ${analysisStandards}">
                                        <th:block th:if="${analysisStandard != null and analysisStandard.standard != null and standards.contains(analysisStandard.standard)}"
                                                  th:with="standard=${analysisStandard.standard},
                                                           standardId=${standard.id != null ? standard.id : 0},
                                                           standardName=${standard.name != null ? standard.name : ''},
                                                           standardLabel=${standard.label != null ? standard.label : ''},
                                                           standardVersion=${standard.version != null ? standard.version : ''}">
                                            <option th:title="#{{${standardName} : ${standardLabel} - v.${standardVersion}}}"
                                                    th:value="${standardId}"
                                                    th:data-trick-id="${analysisId}">
                                                <span th:text="${standardName}"></span>
                                            </option>
                                        </th:block>
                                    </th:block>
                                </th:block>
                            </th:block>
                        </select>
                    </div>
                </form>
            </fieldset>
        </div>
    </div>
</div>
