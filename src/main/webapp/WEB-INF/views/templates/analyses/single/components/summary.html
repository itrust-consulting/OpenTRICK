<div class="tab-pane" id="tab-summary">
    <div class="section" id="section_summary">
    <div th:with="summariesStages=${T(lu.itrust.business.ts.model.actionplan.summary.helper.ActionPlanSummaryManager).getRows(summaries,phases)}">
            <div class="page-header tab-content-header">
                <div class="container">
                    <div class="row-fluid">
                        <h3>
                            <span th:text="#{label.title.action_plan.summary}"></span>
                        </h3>
                    </div>
                </div>
            </div>
            <ul id="menu_summary" class="nav nav-pills bordered-bottom" th:if="${summariesStages != null}">
                <div th:switch="${type.quantitative}">
                    <div th:case="true">
                        <ul>
                            <li th:each="actionPlanType, status : ${summariesStages.keySet()}" 
                                th:classappend="${status.index == 0 ? 'disabled' : ''}" 
                                th:data-trick-nav-control="${actionPlanType.name}">
                                <a href="#" th:onclick="|return navToogled('#section_summary','#menu_summary','#tabOption','${actionPlanType.name}', true);|">
                                    <span th:text="#{${'label.title.plan_type.' + #strings.toLowerCase(actionPlanType.name)}}"></span>
                                </a>
                            </li>
                        </ul>
                        <li class="pull-right">
                            <a href="#" th:onclick="|return displayActionPlanOptions(${analysisId == null ? analysis.id : analysisId});|">
                                <i class="glyphicon glyphicon-expand"></i>
                                <span th:text="#{label.action.compute}"></span>
                            </a>
                        </li>
                    </div>
                    <div th:case="false">
                        <li>
                            <a href="#" th:onclick="|return calculateAction()|">
                                <i class="glyphicon glyphicon-expand"></i> 
                                <span th:text="#{label.action.compute}"></span>
                            </a>
                        </li>
                    </div>
                </div>
            </ul>

            <div th:if="${summariesStages != null}" th:each="actionPlanType, status : ${summariesStages.keySet()}">
                <div th:with="summaryStages=${summariesStages[actionPlanType]}" th:classappend="${status.index != 0 ? 'hidden' : ''}">
              <table class="table table-hover table-condensed table-fixed-header-analysis" 
                  th:id="|summarytable_${#messages.msg(actionPlanType.name)}|">
                        <thead>
                            <tr>
                                <th style="width: 30%;">
                                    <span th:text="#{label.characteristic}"></span>
                                </th>
                                <th:block th:with="stages=${summaryStages != null ? summaryStages['label.characteristic'] : []},
                                                   columncount=${stages != null ? (stages.size() != null ? stages.size() : 0) : 0}">
                                    <th th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                        class="text-right"
                                        th:text="${(stages != null and i < (stages.size()?:0)) ? stages[i] : ''}"></th>
                                </th:block>
                            </tr>
                        </thead>
                        <tbody>
                            <th:block th:with="begindates=${summaryStages != null ? summaryStages['label.phase.begin.date'] : []},
                                                enddates=${summaryStages != null ? summaryStages['label.phase.end.date'] : []},
                                                measurecounts=${summaryStages != null ? summaryStages['label.characteristic.count.measure.phase'] : []},
                                                implementedcounts=${summaryStages != null ? summaryStages['label.characteristic.count.measure.implemented'] : []},
                                                nonCompliantMeasure27001=${summaryStages != null ? summaryStages['label.characteristic.count.not_compliant_measure_27001'] : []},
                                                nonCompliantMeasure27002=${summaryStages != null ? summaryStages['label.characteristic.count.not_compliant_measure_27002'] : []},
                                                totalcosts=${summaryStages != null ? summaryStages['label.resource.planning.total.phase.cost'] : []}">

                                <tr>
                                    <td><span th:text="#{label.phase.begin.date}"></span></td>
                                    <td th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                        class="text-right">
                                        <span th:text="${(begindates != null and i < (begindates.size()?:0) and begindates[i] != null) ? #dates.format(begindates[i], 'yyyy-MM-dd') : ''}"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <td><span th:text="#{label.phase.end.date}"></span></td>
                                    <td th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                        class="text-right">
                                        <span th:text="${(enddates != null and i < (enddates.size()?:0) and enddates[i] != null) ? #dates.format(enddates[i], 'yyyy-MM-dd') : ''}"></span>
                                    </td>
                                </tr>

                                <th:block th:if="${summaryStages != null}" th:each="key : ${summaryStages.keySet()}">
                                    <th:block th:if="${key.startsWith('label.characteristic.compliance')}">
                                        <th:block th:with="standardLabel=${key.substring(31)}">
                                            <tr>
                                                <td>
                                                    <span th:text="#{label.characteristic.compliance}"></span>
                                                    <span th:text="${standardLabel}"></span> (%)
                                                </td>
                                                <td th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                                    class="text-right">
                                                    <span th:text="${#numbers.formatDecimal((((summaryStages[key] != null and i < (summaryStages[key].size()?:0)) ? summaryStages[key][i] : 0) * 100), 0, 0)}"></span>
                                                </td>
                                            </tr>
                                        </th:block>
                                    </th:block>
                                </th:block>

                                <tr>
                                    <td><span th:text="#{label.characteristic.count.measure.phase}"></span></td>
                                    <td th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                        class="text-right">
                                        <span th:text="${#numbers.formatDecimal((measurecounts != null and i < (measurecounts.size()?:0) and measurecounts[i] != null) ? measurecounts[i] : 0, 0, 0)}"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <td><span th:text="#{label.characteristic.count.measure.implemented}"></span></td>
                                    <td th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                        class="text-right">
                                        <span th:text="${#numbers.formatDecimal((implementedcounts != null and i < (implementedcounts.size()?:0) and implementedcounts[i] != null) ? implementedcounts[i] : 0, 0, 0)}"></span>
                                    </td>
                                </tr>
                            </th:block>

                            <!-- Repeat similar blocks for other data sections (profitability, resources, etc.) -->
                        </tbody>
                        <tfoot style="font-weight: bold; border-top: #dddddd solid;">
                            <tr class="active">
                                <td><span th:text="#{label.resource.planning.total.phase.cost}"></span></td>
                                <td th:each="i : ${#numbers.sequence(0, (columncount > 0 ? columncount-1 : -1))}"
                                    class="text-right">
                                    <span th:text="${#numbers.formatDecimal((((totalcosts != null and i < (totalcosts.size()?:0) and totalcosts[i] != null) ? totalcosts[i] : 0) * 0.001), 0, 0)}"></span>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
