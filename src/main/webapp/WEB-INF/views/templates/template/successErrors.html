<div th:fragment="successErrors">
	<div th:if="${success}" class="alert alert-success" id="success">
		<a href="#" class="close" data-dismiss="alert" style="margin-right: -10px; margin-top: -12px">×</a>
		<div data-notification-type='success' th:text="${success != null} ? #{${success}} : ${success}">
			This a success message!
		</div>
		<th:block th:inline="text">[[${#application.removeAttribute('success')}]]</th:block>
	</div>

	<div th:if="${error}" class="alert alert-danger" id="error">
		<a href="#" class="close" data-dismiss="alert" style="margin-right: -10px; margin-top: -12px">×</a>
		<div data-notification-type='error' th:text="${error != null} ? #{${error}} : ${error}">
		</div>
		<th:block th:inline="text">[[${#application.removeAttribute('error')}]]</th:block>
	</div>

	<div th:if="${errors}" class="alert alert-danger" id="error">
		<a href="#" class="close" data-dismiss="alert" style="margin-right: -10px; margin-top: -12px">×</a>
		<div data-notification-type='error' th:text="${errors != null} ? #{${errors}} : ${errors}">
			This an error message!
		</div>
		<th:block th:inline="text">[[${#application.removeAttribute('errors')}]]</th:block>
	</div>

	<div th:if="${errorTRICKException}" class="alert alert-danger" id="error">
		<a href="#" class="close" data-dismiss="alert" style="margin-right: -10px; margin-top: -12px">×</a>
		<div data-notification-type='error'
			th:text="${errorTRICKException != null and errorTRICKException.code != null} ? #{${errorTRICKException.code}(errorTRICKException.parameters)} : ${errorTRICKException != null ? errorTRICKException.message : ''}">
			This an exception message!
		</div>
	</div>

	<div th:if="${errorHANDLER}" class="alert alert-danger" id="error">
		<a href="#" class="close" data-dismiss="alert" style="margin-right: -10px; margin-top: -12px">×</a>
		<div data-notification-type='error'
			th:text="${errorHANDLER != null and errorHANDLER.code != null} ? #{${errorHANDLER.code}(errorHANDLER.parameters)} : ${errorHANDLER != null ? errorHANDLER.message : ''}">
			This an error handler message!
		</div>
	</div>
</div>
