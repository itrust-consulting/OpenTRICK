<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="[[${locale.language}]]" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{templates/template/header :: header('label.title.error.503')}"></th:block>
</head>
<body>
    <div id="wrap">
        <!-- ################################################################### Nav Menu ################################################################### -->
        <th:block th:replace="~{templates/template/menu :: main-menu(menu, analysisSharedCount)}"></th:block>

        <div class="container">
            <!-- Success/Error Message -->
            <th:block th:replace="~{templates/template/successErrors :: successErrors}"></th:block>

            <!-- #################################################################### Content ################################################################### -->
            <div class="page-header">
                <h1 th:text="#{label.title.error.503}">503: Service Unavailable</h1>
            </div>

            <div class="content" id="content" data-spy="scroll">
                <span th:text="#{error.503.message}">The service is temporarily unavailable.</span>
            </div>
        </div>

        <!-- ################################################################ Include Footer ################################################################ -->
        <th:block th:replace="~{templates/template/footer :: footer}"></th:block>
    </div>

    <!-- Include Scripts -->
    <th:block th:replace="~{templates/template/scripts :: scripts}"></th:block>
</body>
</html>
