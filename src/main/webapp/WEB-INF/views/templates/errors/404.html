<!DOCTYPE html>
<html lang="[[${locale.language}]]">
<head>
    <th:block th:if="${locale == null}">
        <th:block th:with="locale=${T(org.springframework.web.servlet.support.RequestContextUtils).getLocale(request)}"></th:block>
    </th:block>
    <th:block th:replace="~{templates/template/header :: header}" />
</head>
<body>
    <div id="wrap">
        <th:block th:replace="~{templates/template/menu :: menu}" />
        <div class="container">
            <th:block th:replace="~{templates/template/successErrors :: successErrors}" />
            <div class="page-header">
                <h1>
                    <span th:text="#{title.error.404}">404: Page not found</span>
                </h1>
            </div>
            <div class="content" id="content" data-spy="scroll">
                <span th:text="#{error.404.message}">The page you are trying to access could not be found!</span>
            </div>
        </div>
        <th:block th:replace="~{templates/template/footer :: footer}" />
    </div>
    <th:block th:replace="~{templates/template/scripts :: scripts}" />
</body>
</html>
