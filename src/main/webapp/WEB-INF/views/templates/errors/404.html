<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="[[${locale.language}]]" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:if="${#locale != null}">
    <th:block th:with="locale=${#locale}"></th:block>
</th:block>

    <th:block th:replace="~{templates/template/header :: header('label.title.error.404')}" />
</head>
<body>
    <div id="wrap">
        <th:block th:replace="~{templates/template/menu :: main-menu(menu, analysisSharedCount)}" />
        <div class="container">
            <th:block th:replace="~{templates/template/successErrors :: successErrors}" />
            <div class="page-header">
                <h1>
                    <span th:text="#{label.title.error.404}">404: Page not found</span>
                </h1>
            </div>
            <div class="content" id="content" data-spy="scroll">
                <span th:text="#{error.404.message}">The page you are trying to access could not be found!</span>
            </div>
        </div>
        <th:block th:replace="~{templates/template/footer :: footer}" />
    </div>
    <th:block th:replace="~{templates/template/scripts :: scripts}" />
</body>
</html>
