<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="[[${locale.language}]]" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- Include Header -->
    <th:block th:replace="~{templates/template/header :: header('label.title.error.405')}"></th:block>
</head>
<body>
    <div id="wrap">
        <!-- ################################################################### Nav Menu ################################################################### -->
        <th:block th:replace="~{templates/template/menu :: main-menu(menu, analysisSharedCount)}"></th:block>
        <div class="container">
            <!-- Include Success/Errors -->
            <th:block th:replace="~{templates/template/successErrors :: successErrors}"></th:block>
            <!-- #################################################################### Content ################################################################### -->
            <div class="page-header">
                <h1>
                    <span th:text="#{label.title.error.405}">405: Method not allowed</span>
                </h1>
            </div>
            <div class="content" id="content" data-spy="scroll">
                <span th:text="#{error.405.message}">The method used for this request is not allowed!</span>
            </div>
            <!-- ################################################################ End Container ################################################################# -->
        </div>
        <!-- ################################################################ Include Footer ################################################################ -->
        <th:block th:replace="~{templates/template/footer :: footer}"></th:block>
    </div>
    <th:block th:replace="~{templates/template/scripts :: scripts}"></th:block>
</body>
</html>
