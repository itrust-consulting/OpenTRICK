<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="${#locale.language}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:replace="templates/template/header :: header('label.title.error.403')"></div>

<body>
    <div id="wrap">
        <div th:replace="templates/template/menu :: main-menu('analysis', 0)"></div>

        <div class="container">
            <div th:replace="templates/template/successErrors :: successErrors"></div>

            <div class="page-header">
                <h1>
                    <span th:text="#{title.error.403}">403: Permission denied</span>
                </h1>
            </div>

            <div class="content" id="content" role="main" data-spy="scroll">
                <span th:text="#{error.403.message}">You do not have the necessary permissions to perform this action!</span>
            </div>
        </div>
    </div>

    <div th:replace="templates/template/footer :: footer"></div>
    <div th:replace="templates/template/scripts :: scripts"></div>
</body>
</html>
